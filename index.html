<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник тренировок</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

/* Контейнер */
.container {
  padding: 15px;
  padding-bottom: 80px;
}

/* Заголовки */
h1 {
  font-size: 22px;
  margin-bottom: 10px;
}

/* Инпуты */
input {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

/* Кнопки */
button {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  border: none;
  border-radius: 12px;
  background: #2e7dff;
  color: white;
  font-size: 16px;
}

/* Карточки */
.card {
  background: #1c1c1c;
  padding: 15px;
  margin-top: 12px;
  border-radius: 14px;
}

/* Упражнение */
.exercise {
  margin-top: 10px;
  padding: 10px;
  background: #2a2a2a;
  border-radius: 10px;
}

/* Подход */
.set {
  background: #333;
  padding: 8px;
  margin-top: 5px;
  border-radius: 8px;
  font-size: 14px;
}

/* Фикс кнопка */
.fab {
  position: fixed;
  bottom: 15px;
  left: 15px;
  right: 15px;
  background: #00c853;
  font-size: 18px;
}
</style>
</head>
<body>

<div class="container">

<h1>💪 Тренировка</h1>

<input id="date" type="date">

<div id="currentWorkout"></div>

<button onclick="saveWorkout()">💾 Сохранить тренировку</button>

<h1>📊 История</h1>
<div id="history"></div>

</div>

<!-- КНОПКА ВНИЗУ -->
<button class="fab" onclick="addExercise()">+ Упражнение</button>

<script>
let workouts = JSON.parse(localStorage.getItem("workouts")) || [];
let current = { exercises: [] };

function addExercise() {
  const name = prompt("Название упражнения:");
  if (!name) return;

  current.exercises.push({
    name,
    sets: []
  });

  renderCurrent();
}

function addSet(index) {
  const weight = prompt("Вес?");
  const reps = prompt("Повторы?");

  if (!weight || !reps) return;

  current.exercises[index].sets.push({ weight, reps });
  renderCurrent();
}

function renderCurrent() {
  const div = document.getElementById("currentWorkout");
  div.innerHTML = "";

  current.exercises.forEach((ex, i) => {
    div.innerHTML += `
      <div class="card">
        <b>${ex.name}</b>
        <button onclick="addSet(${i})">+ подход</button>

        ${ex.sets.map(s => `
          <div class="set">${s.weight} кг × ${s.reps}</div>
        `).join("")}
      </div>
    `;
  });
}

function saveWorkout() {
  const date = document.getElementById("date").value;
  if (!date || current.exercises.length === 0) return;

  workouts.push({
    date,
    exercises: current.exercises
  });

  localStorage.setItem("workouts", JSON.stringify(workouts));

  current = { exercises: [] };
  document.getElementById("date").value = "";

  renderCurrent();
  renderHistory();
}

function renderHistory() {
  const div = document.getElementById("history");
  div.innerHTML = "";

  workouts.forEach(w => {
    div.innerHTML += `
      <div class="card">
        📅 ${w.date}
        ${w.exercises.map(ex => `
          <div class="exercise">
            <b>${ex.name}</b>
            ${ex.sets.map(s => `
              <div class="set">${s.weight} × ${s.reps}</div>
            `).join("")}
          </div>
        `).join("")}
      </div>
    `;
  });
}

renderHistory();
</script>

</body>
</html>
