<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дневник тренировок</title>

<style>
body {
  font-family: Arial;
  max-width: 700px;
  margin: 40px auto;
  background: #111;
  color: white;
}

input, button {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
}

.card {
  background: #222;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
}

.exercise {
  margin-top: 10px;
  padding-left: 10px;
  border-left: 2px solid #555;
}
</style>
</head>
<body>

<h1>💪 Дневник тренировок</h1>

<h3>Дата</h3>
<input id="date" type="date">

<h3>Добавить упражнение</h3>
<input id="exercise" placeholder="Например: Жим под углом">
<button onclick="addExercise()">Добавить упражнение</button>

<div id="currentWorkout"></div>

<button onclick="saveWorkout()">💾 Сохранить тренировку</button>

<h2>История</h2>
<div id="history"></div>

<script>
let workouts = JSON.parse(localStorage.getItem("workouts")) || [];
let current = { date: "", exercises: [] };

function addExercise() {
  const name = document.getElementById("exercise").value;
  if (!name) return;

  current.exercises.push({
    name,
    sets: []
  });

  document.getElementById("exercise").value = "";
  renderCurrent();
}

function addSet(index) {
  const weight = prompt("Вес?");
  const reps = prompt("Повторы?");

  if (!weight || !reps) return;

  current.exercises[index].sets.push({ weight, reps });
  renderCurrent();
}

function renderCurrent() {
  const div = document.getElementById("currentWorkout");
  div.innerHTML = "";

  current.exercises.forEach((ex, i) => {
    div.innerHTML += `
      <div class="card">
        <b>${ex.name}</b>
        <button onclick="addSet(${i})">+ подход</button>

        ${ex.sets.map(s => `
          <div>— ${s.weight} кг × ${s.reps}</div>
        `).join("")}
      </div>
    `;
  });
}

function saveWorkout() {
  const date = document.getElementById("date").value;
  if (!date || current.exercises.length === 0) return;

  workouts.push({
    date,
    exercises: current.exercises
  });

  localStorage.setItem("workouts", JSON.stringify(workouts));

  current = { date: "", exercises: [] };
  document.getElementById("date").value = "";

  renderCurrent();
  renderHistory();
}

function renderHistory() {
  const div = document.getElementById("history");
  div.innerHTML = "";

  workouts.forEach(w => {
    div.innerHTML += `
      <div class="card">
        📅 ${w.date}
        ${w.exercises.map(ex => `
          <div class="exercise">
            <b>${ex.name}</b>
            ${ex.sets.map(s => `
              <div>— ${s.weight} × ${s.reps}</div>
            `).join("")}
          </div>
        `).join("")}
      </div>
    `;
  });
}

renderHistory();
</script>

</body>
</html>
