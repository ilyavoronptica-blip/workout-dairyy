<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BRO ДНЕВНИК</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #1a1a2e;
            padding-bottom: 70px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* страницы */
        .page {
            display: none;
            animation: fade 0.2s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 10px 16px 22px;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            transition: 0.1s;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .nav-item.active {
            color: #e67e22;
            background: #fff0e6;
        }
        .nav-icon {
            font-size: 22px;
        }

        /* карточки */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #eee;
        }
        .exercise-card {
            background: #fafafa;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #e67e22;
            border-right: 1px solid #eee;
        }

        /* кнопки */
        button {
            background: #eef2f5;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: 0.1s;
            color: #1a1a2e;
        }
        button.primary {
            background: #e67e22;
            color: white;
        }
        button.danger {
            background: #fee2e2;
            color: #c0392b;
        }
        button.outline {
            background: transparent;
            border: 1px solid #ddd;
        }
        button.small {
            padding: 5px 12px;
            font-size: 12px;
        }
        button:hover {
            opacity: 0.85;
        }

        /* таблицы подходов */
        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 14px;
        }
        .sets-table th {
            text-align: left;
            padding: 8px 6px;
            color: #888;
            font-weight: 500;
        }
        .sets-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #eeefef;
        }
        input {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 10px;
            border-radius: 24px;
            font-size: 14px;
            width: 80px;
            transition: 0.1s;
        }
        input:focus {
            outline: none;
            border-color: #e67e22;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

        /* история */
        .history-item {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 1px solid #eee;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .history-date {
            font-size: 12px;
            color: #e67e22;
            font-weight: 500;
        }
        .history-preview {
            font-size: 14px;
            color: #555;
            margin-top: 4px;
        }
        .history-details {
            margin-top: 16px;
            display: none;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .history-details.open {
            display: block;
        }

        /* поиск */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            width: auto;
        }
        .search-result-item {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }
        .search-result-date {
            font-size: 12px;
            color: #e67e22;
            margin-bottom: 6px;
        }

        /* шаблоны */
        .template-item {
            background: #fafafa;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }
        h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #444;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
            background: #fafafa;
            border-radius: 20px;
        }
        .badge {
            background: #fff0e6;
            color: #e67e22;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #e67e22;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ГЛАВНАЯ -->
    <div id="homePage" class="page active">
        <h2>Твой дневник</h2>
        <div class="card">
            <div style="font-size: 32px; margin-bottom: 8px;">🏋️ Привет, бро</div>
            <div style="color: #666; margin-bottom: 20px;">Записывай тренировки и следи за прогрессом</div>
            <button id="quickNewBtn" class="primary" style="width:100%;">➕ Новая тренировка</button>
        </div>
        <div class="card">
            <div style="font-weight: 600; margin-bottom: 16px;">📊 Статистика</div>
            <div style="display: flex; justify-content: space-between; text-align: center;">
                <div><div class="stat-number" id="statsTotal">0</div><div style="font-size: 12px; color:#888;">тренировок</div></div>
                <div><div class="stat-number" id="statsExercises">0</div><div style="font-size: 12px; color:#888;">упражнений</div></div>
            </div>
        </div>
        <div class="card">
            <div style="font-weight: 600; margin-bottom: 12px;">⭐ Быстрые шаблоны</div>
            <div id="templatesList"></div>
        </div>
    </div>

    <!-- НОВАЯ ТРЕНИРОВКА -->
    <div id="newPage" class="page">
        <h2>Новая тренировка</h2>
        <div id="exercisesBuilder"></div>
        <div class="flex-between">
            <button id="addExerciseBtn" class="outline">➕ Добавить упражнение</button>
            <button id="saveWorkoutBtn" class="primary">💾 Сохранить</button>
        </div>
        <div class="flex-between" style="margin-top: 12px;">
            <button id="saveAsTemplateBtn" class="outline small">⭐ Сохранить как шаблон</button>
            <button id="clearBuilderBtn" class="danger small">🗑 Очистить всё</button>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="historyPage" class="page">
        <h2>История</h2>
        <div class="search-bar">
            <input type="text" id="historySearch" placeholder="🔍 Поиск по упражнению...">
            <button id="clearHistorySearch" class="outline small">Сброс</button>
        </div>
        <div id="historyList"></div>
    </div>

    <!-- ПОИСК -->
    <div id="searchPage" class="page">
        <h2>Поиск упражнений</h2>
        <div class="search-bar">
            <input type="text" id="progressSearch" placeholder="Например: Румынка, Жим, Брусья">
            <button id="doSearchBtn" class="primary">Найти</button>
        </div>
        <div id="searchResults"></div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settingsPage" class="page">
        <h2>Настройки</h2>
        <div class="card">
            <div style="font-weight: 600; margin-bottom: 14px;">📁 Шаблоны тренировок</div>
            <div id="templatesManageList"></div>
            <hr style="margin: 20px 0; border-color: #eee;">
            <button id="exportDataBtn" class="outline" style="width:100%; margin-bottom: 10px;">📤 Экспорт данных</button>
            <button id="importDataBtn" class="outline" style="width:100%; margin-bottom: 10px;">📥 Импорт данных</button>
            <input type="file" id="importFile" style="display:none;">
            <button id="clearAllBtn" class="danger" style="width:100%;">⚠️ Удалить всё</button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item" data-page="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
    <button class="nav-item" data-page="new"><span class="nav-icon">📝</span><span>Новая</span></button>
    <button class="nav-item" data-page="history"><span class="nav-icon">📋</span><span>История</span></button>
    <button class="nav-item" data-page="search"><span class="nav-icon">🔍</span><span>Поиск</span></button>
    <button class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span>Настройки</span></button>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let workouts = [];
    let templates = [];
    let currentExercises = [];

    function loadData() {
        let w = localStorage.getItem("bro_workouts");
        let t = localStorage.getItem("bro_templates");
        if(w) workouts = JSON.parse(w);
        if(t) templates = JSON.parse(t);
    }

    function saveData() {
        localStorage.setItem("bro_workouts", JSON.stringify(workouts));
        localStorage.setItem("bro_templates", JSON.stringify(templates));
        renderStats();
        renderTemplates();
        renderHistory();
    }

    function getUnit(name) {
        let n = name.toLowerCase();
        if(n.includes("плит") || n.includes("бабочка") || n.includes("разгибание")) return "пл";
        return "кг";
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    // ========== СТАТИСТИКА ==========
    function renderStats() {
        let totalEx = workouts.reduce((sum,w)=> sum + w.exercises.length, 0);
        let statsTotal = document.getElementById("statsTotal");
        let statsExercises = document.getElementById("statsExercises");
        if(statsTotal) statsTotal.innerText = workouts.length;
        if(statsExercises) statsExercises.innerText = totalEx;
    }

    // ========== ШАБЛОНЫ ==========
    function renderTemplates() {
        let container = document.getElementById("templatesList");
        if(!container) return;
        if(templates.length === 0) {
            container.innerHTML = "<div style='color:#999; padding:8px 0;'>Нет шаблонов</div>";
            return;
        }
        let html = "";
        templates.slice(0,3).forEach(t => {
            html += `<div class="template-item"><span>⭐ ${escapeHtml(t.name)}</span><button class="small outline" onclick="loadTemplateById(${t.id})">Загрузить</button></div>`;
        });
        if(templates.length > 3) html += `<div style="font-size:12px; color:#888; margin-top:8px;">+ ещё ${templates.length-3} шаблонов</div>`;
        container.innerHTML = html;
    }

    function renderTemplatesManage() {
        let container = document.getElementById("templatesManageList");
        if(!container) return;
        if(templates.length === 0) {
            container.innerHTML = "<div style='color:#999;'>Нет сохранённых шаблонов</div>";
            return;
        }
        let html = "";
        templates.forEach(t => {
            html += `<div class="template-item"><span>📌 ${escapeHtml(t.name)}</span><button class="small danger" onclick="deleteTemplateById(${t.id})">Удалить</button></div>`;
        });
        container.innerHTML = html;
    }

    window.loadTemplateById = (id) => {
        let t = templates.find(t => t.id === id);
        if(t) {
            currentExercises = JSON.parse(JSON.stringify(t.exercises));
            renderBuilder();
            showPage('new');
        }
    };

    window.deleteTemplateById = (id) => {
        templates = templates.filter(t => t.id !== id);
        saveData();
        renderTemplatesManage();
        renderTemplates();
    };

    // ========== КОНСТРУКТОР ==========
    function renderBuilder() {
        let container = document.getElementById("exercisesBuilder");
        if(!container) return;
        if(currentExercises.length === 0) {
            container.innerHTML = `<div class="card empty-state">➕ Нажми «Добавить упражнение»</div>`;
            return;
        }
        let html = "";
        currentExercises.forEach((ex, idx) => {
            let isSuper = ex.isSuper || false;
            html += `<div class="exercise-card">
                        <div class="flex-between">
                            <span><b>${escapeHtml(ex.name1)}${isSuper ? ` + ${escapeHtml(ex.name2)}` : ''}</b>${isSuper ? '<span class="badge">суперсет</span>' : ''}</span>
                            <div>
                                <button class="small outline" onclick="toggleSuper(${idx})">${isSuper ? '➖ Отменить суперсет' : '🔗 Суперсет'}</button>
                                <button class="small danger" onclick="delEx(${idx})">🗑</button>
                            </div>
                        </div>
                        <table class="sets-table"><tbody id="setsBody${idx}"></tbody></table>
                        <button class="small outline" onclick="addSet(${idx})">+ Добавить подход</button>
                    </div>`;
        });
        container.innerHTML = html;
        for(let i=0; i<currentExercises.length; i++) {
            renderSets(i);
        }
    }

    function renderSets(idx) {
        let ex = currentExercises[idx];
        let tbody = document.getElementById(`setsBody${idx}`);
        if(!tbody) return;
        let html = "";
        for(let s=0; s<ex.sets.length; s++) {
            let set = ex.sets[s];
            if(ex.isSuper) {
                html += `<tr>
                            <td><input type="text" value="${set.w1||''}" placeholder="вес" class="setW1" data-ex="${idx}" data-set="${s}" style="width:70px;"> <span style="font-size:11px;">${ex.unit1||'кг'}</span></td>
                            <td><input type="text" value="${set.reps1||''}" placeholder="повторы" class="setReps1" data-ex="${idx}" data-set="${s}" style="width:60px;"></td>
                            <td style="text-align:center;">+</td>
                            <td><input type="text" value="${set.w2||''}" placeholder="вес" class="setW2" data-ex="${idx}" data-set="${s}" style="width:70px;"> <span style="font-size:11px;">${ex.unit2||'кг'}</span></td>
                            <td><input type="text" value="${set.reps2||''}" placeholder="повторы" class="setReps2" data-ex="${idx}" data-set="${s}" style="width:60px;"></td>
                            <td><button class="small danger" onclick="delSet(${idx},${s})" style="padding:4px 8px;">✗</button></td>
                         </tr>`;
            } else {
                html += `<tr>
                            <td><input type="text" value="${set.weight||''}" placeholder="вес" class="setWeight" data-ex="${idx}" data-set="${s}" style="width:80px;"> <span style="font-size:11px;">${ex.unit1||'кг'}</span></td>
                            <td><input type="text" value="${set.reps||''}" placeholder="повторы" class="setReps" data-ex="${idx}" data-set="${s}" style="width:70px;"></td>
                            <td><button class="small danger" onclick="delSet(${idx},${s})" style="padding:4px 8px;">✗</button></td>
                         </tr>`;
            }
        }
        tbody.innerHTML = html;
        
        document.querySelectorAll(`.setWeight[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].weight=inp.value; };
        });
        document.querySelectorAll(`.setReps[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].reps=inp.value; };
        });
        document.querySelectorAll(`.setW1[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].w1=inp.value; };
        });
        document.querySelectorAll(`.setW2[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].w2=inp.value; };
        });
        document.querySelectorAll(`.setReps1[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].reps1=inp.value; };
        });
        document.querySelectorAll(`.setReps2[data-ex="${idx}"]`).forEach(inp => {
            inp.onchange = (e) => { let exx=currentExercises[idx]; let sidx=parseInt(inp.dataset.set); exx.sets[sidx].reps2=inp.value; };
        });
    }

    window.addSet = (idx) => {
        let ex = currentExercises[idx];
        if(ex.isSuper) ex.sets.push({w1:"", reps1:"", w2:"", reps2:""});
        else ex.sets.push({weight:"", reps:""});
        renderSets(idx);
    };

    window.delSet = (exIdx, setIdx) => {
        currentExercises[exIdx].sets.splice(setIdx,1);
        renderSets(exIdx);
    };

    window.delEx = (idx) => {
        currentExercises.splice(idx,1);
        renderBuilder();
    };

    window.toggleSuper = (idx) => {
        let ex = currentExercises[idx];
        if(ex.isSuper) {
            let newSets = ex.sets.map(s => ({weight: s.w1 || "", reps: s.reps1 || ""}));
            ex.isSuper = false;
            ex.name2 = "";
            ex.sets = newSets;
        } else {
            let name2 = prompt("Второе упражнение для суперсета:", "Разгибания");
            if(!name2) return;
            let newSets = ex.sets.map(s => ({w1: s.weight || "", reps1: s.reps || "", w2: "", reps2: ""}));
            ex.isSuper = true;
            ex.name2 = name2;
            ex.unit2 = getUnit(name2);
            ex.sets = newSets;
        }
        renderBuilder();
    };

    function addExercise() {
        let name = prompt("Название упражнения:");
        if(!name) return;
        currentExercises.push({
            name1: name, isSuper: false, unit1: getUnit(name),
            sets: [{weight:"", reps:""}]
        });
        renderBuilder();
    }

    function saveWorkout() {
        if(currentExercises.length === 0) return alert("Добавь упражнения");
        let copy = JSON.parse(JSON.stringify(currentExercises));
        workouts.unshift({ id: Date.now(), date: Date.now(), exercises: copy });
        saveData();
        currentExercises = [];
        renderBuilder();
        alert("Тренировка сохранена!");
        showPage('history');
    }

    function saveAsTemplate() {
        if(currentExercises.length === 0) return alert("Нет упражнений");
        let name = prompt("Название шаблона:", "Моя тренировка");
        if(!name) return;
        let copy = JSON.parse(JSON.stringify(currentExercises));
        templates.push({ id: Date.now(), name: name, exercises: copy });
        saveData();
        alert("Шаблон сохранён");
    }

    // ========== ИСТОРИЯ ==========
    function renderHistory() {
        let container = document.getElementById("historyList");
        let search = document.getElementById("historySearch")?.value.toLowerCase() || "";
        if(!container) return;
        
        let filtered = workouts.filter(w => {
            if(!search) return true;
            return w.exercises.some(e => e.name1.toLowerCase().includes(search) || (e.name2 && e.name2.toLowerCase().includes(search)));
        });
        
        if(filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">📭 Нет тренировок</div>`;
            return;
        }
        
        let html = "";
        filtered.forEach(w => {
            let d = new Date(w.date);
            let dateStr = `${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
            let preview = w.exercises.map(e=>e.name1+(e.name2?`+${e.name2}`:'')).join(", ");
            html += `<div class="history-item" data-id="${w.id}">
                        <div class="history-header">
                            <span class="history-date">📅 ${dateStr}</span>
                            <div>
                                <button class="small outline edit-workout" data-id="${w.id}">✏️ Править</button>
                                <button class="small danger delete-workout" data-id="${w.id}">🗑 Удалить</button>
                            </div>
                        </div>
                        <div class="history-preview">${escapeHtml(preview.substring(0, 60))}</div>
                        <div class="history-details" data-details="${w.id}"></div>
                    </div>`;
        });
        container.innerHTML = html;
        
        filtered.forEach(w => {
            let detailsDiv = document.querySelector(`.history-details[data-details="${w.id}"]`);
            if(detailsDiv) {
                let table = `<table style="width:100%; font-size:13px;">`;
                for(let ex of w.exercises) {
                    if(ex.isSuper) {
                        table += `<tr><td colspan="2" style="padding:8px 0 4px;"><b>${escapeHtml(ex.name1)} + ${escapeHtml(ex.name2)}</b></td></tr>`;
                        for(let set of ex.sets) {
                            table += `<tr><td style="padding:4px 0;">${set.w1||'?'} ${ex.unit1} x ${set.reps1||'?'}</td><td>+ ${set.w2||'?'} ${ex.unit2} x ${set.reps2||'?'}</td></tr>`;
                        }
                    } else {
                        table += `<tr><td colspan="2" style="padding:8px 0 4px;"><b>${escapeHtml(ex.name1)}</b></td></tr>`;
                        for(let set of ex.sets) {
                            table += `<tr><td style="padding:4px 0;">${set.weight||'?'} ${ex.unit1}</td><td>→ ${set.reps||'?'} раз</td></tr>`;
                        }
                    }
                }
                table += `</table>`;
                detailsDiv.innerHTML = table;
            }
            
            document.querySelector(`.history-item[data-id="${w.id}"]`).addEventListener('click', (e) => {
                if(e.target.classList.contains('edit-workout') || e.target.classList.contains('delete-workout')) return;
                let dd = document.querySelector(`.history-details[data-details="${w.id}"]`);
                if(dd) dd.classList.toggle('open');
            });
        });
        
        document.querySelectorAll('.edit-workout').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); let id = parseInt(btn.dataset.id); editWorkoutById(id); };
        });
        document.querySelectorAll('.delete-workout').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); let id = parseInt(btn.dataset.id); deleteWorkoutById(id); };
        });
    }

    function editWorkoutById(id) {
        let w = workouts.find(w=>w.id===id);
        if(!w) return;
        currentExercises = JSON.parse(JSON.stringify(w.exercises));
        renderBuilder();
        showPage('new');
    }

    function deleteWorkoutById(id) {
        if(confirm("Удалить тренировку?")) {
            workouts = workouts.filter(w=>w.id!==id);
            saveData();
            renderHistory();
            renderStats();
        }
    }

    // ========== ПОИСК ==========
    function searchExercise() {
        let query = document.getElementById("progressSearch").value.trim().toLowerCase();
        if(!query) return alert("Введи название упражнения");
        
        let results = [];
        for(let w of workouts) {
            for(let ex of w.exercises) {
                let name1 = ex.name1.toLowerCase();
                let name2 = ex.name2?.toLowerCase() || "";
                if(name1.includes(query) || name2.includes(query)) {
                    for(let set of ex.sets) {
                        let text = "";
                        if(ex.isSuper) text = `${set.w1||'?'} ${ex.unit1} x ${set.reps1||'?'} + ${set.w2||'?'} ${ex.unit2} x ${set.reps2||'?'}`;
                        else text = `${set.weight||'?'} ${ex.unit1} x ${set.reps||'?'}`;
                        results.push({ date: w.date, exName: ex.name1+(ex.name2?`+${ex.name2}`:''), setText: text });
                    }
                }
            }
        }
        
        let container = document.getElementById("searchResults");
        if(results.length === 0) {
            container.innerHTML = `<div class="empty-state">🔍 Ничего не найдено</div>`;
            return;
        }
        
        let html = "";
        for(let r of results) {
            let d = new Date(r.date);
            html += `<div class="search-result-item">
                        <div class="search-result-date">📅 ${d.toLocaleDateString()}</div>
                        <div style="font-weight:500; margin-bottom:4px;">${escapeHtml(r.exName)}</div>
                        <div style="font-family:monospace; font-size:13px;">${escapeHtml(r.setText)}</div>
                    </div>`;
        }
        container.innerHTML = html;
    }

    // ========== НАСТРОЙКИ ==========
    function exportData() {
        let data = { workouts, templates };
        let blob = new Blob([JSON.stringify(data)], {type:"application/json"});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `bro_backup_${Date.now()}.json`;
        a.click();
    }

    function importData(file) {
        let reader = new FileReader();
        reader.onload = (e) => {
            try {
                let data = JSON.parse(e.target.result);
                if(data.workouts) workouts = data.workouts;
                if(data.templates) templates = data.templates;
                saveData();
                renderHistory();
                renderStats();
                renderTemplates();
                renderTemplatesManage();
                alert("Импорт готов!");
            } catch(err) { alert("Ошибка"); }
        };
        reader.readAsText(file);
    }

    function clearAll() {
        if(confirm("Точно удалить всё?")) {
            workouts = [];
            templates = [];
            currentExercises = [];
            saveData();
            renderBuilder();
            renderHistory();
            renderStats();
            renderTemplates();
            renderTemplatesManage();
        }
    }

    // ========== НАВИГАЦИЯ ==========
    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`${page}Page`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
        
        if(page === 'history') renderHistory();
        if(page === 'home') renderStats();
        if(page === 'settings') renderTemplatesManage();
    }

    // ========== ЗАПУСК ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        
        document.getElementById("quickNewBtn").onclick = () => showPage('new');
        document.getElementById("addExerciseBtn").onclick = () => addExercise();
        document.getElementById("saveWorkoutBtn").onclick = () => saveWorkout();
        document.getElementById("clearBuilderBtn").onclick = () => { if(confirm("Очистить?")){ currentExercises=[]; renderBuilder(); } };
        document.getElementById("saveAsTemplateBtn").onclick = () => saveAsTemplate();
        document.getElementById("clearHistorySearch").onclick = () => { document.getElementById("historySearch").value=""; renderHistory(); };
        document.getElementById("historySearch").addEventListener("input", () => renderHistory());
        document.getElementById("doSearchBtn").onclick = () => searchExercise();
        document.getElementById("exportDataBtn").onclick = () => exportData();
        document.getElementById("importDataBtn").onclick = () => document.getElementById("importFile").click();
        document.getElementById("importFile").onchange = (e) => { if(e.target.files[0]) importData(e.target.files[0]); };
        document.getElementById("clearAllBtn").onclick = () => clearAll();
        
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.onclick = () => showPage(btn.dataset.page);
        });
        
        renderBuilder();
        renderStats();
        renderTemplates();
        renderHistory();
        renderTemplatesManage();
        
        showPage('home');
    });
</script>
</body>
</html>
